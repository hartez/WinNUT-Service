syntax = "proto3";

option csharp_namespace = "WinNUT.gPRC";

package clientGUI;

service ClientGUI {
	rpc Subscribe (SubscribeRequest) returns (stream Notification);
	rpc RequestShutdownDelay (DelayRequest) returns (ShutdownNotification); 
}

message SubscribeRequest {
	string subscriber = 1;
}

message DelayRequest {
}

message Notification {
	oneof NotificationType {
		ShutdownInitiatedNotification shutdownInitiated = 1;
		StatusNotification status = 2;
		DeviceInfo deviceInfo = 3;
		ShutdownCanceledNotification shutDownCanceled = 4;
	}
}

message ShutdownInitiatedNotification {
	uint32 remaining = 1;
	bool allowDelayRequest = 2; 
} 

message ShutdownCanceledNotification {
}

message ShutdownNotification {
	oneof NotificationType {
		ShutdownInitiatedNotification shutdownInitiated = 1;
		ShutdownCanceledNotification shutDownCanceled = 4;
	}
}

message StatusNotification {
	uint32 charge = 1;
	string status = 2;
	uint32 batterySecondsRemaining = 3;
}

message DeviceInfo {
	map<string, string> deviceAttributes = 1;
}