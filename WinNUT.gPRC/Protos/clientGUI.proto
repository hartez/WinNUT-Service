syntax = "proto3";

option csharp_namespace = "WinNUT.gPRC";

package clientGUI;

service ClientGUI {
	rpc Subscribe (SubscribeRequest) returns (stream Notification);
	rpc RequestShutdownDelay (DelayRequest) returns (ShutdownNotification); 
}

message SubscribeRequest {
	string subscriber = 1;
}

message DelayRequest {
}

message Notification {
	oneof NotificationType {
		ShutdownInitiated shutdown_initiated = 1;
		DeviceStatus device_status = 2;
		DeviceInfo device_info = 3;
		ShutdownCanceled shutDownCanceled = 4;
		Error error = 5;
	}
}

message ShutdownInitiated {
	int32 remaining = 1;
	bool allowDelayRequest = 2; 
} 

message ShutdownCanceled {
}

message ShutdownNotification {
	oneof NotificationType {
		ShutdownInitiated shutdownInitiated = 1;
		ShutdownCanceled shutDownCanceled = 4;
	}
}

message DeviceStatus {
	string flags = 1;
	int32 charge = 2;
	int32 battery_seconds_remaining = 3;
}

message DeviceInfo {
	map<string, string> deviceAttributes = 1;
}

message Error {
	string description = 1;
}